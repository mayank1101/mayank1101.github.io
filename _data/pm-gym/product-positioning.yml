# PM Gym — product-positioning. Generated from the original page markup;
# edit here to add or reword questions, cards and clues.
practice_badge: |-
  Apply what you learned
practice_heading: |-
  Practice Scenarios
practice_blurb: |-
  15 situations that test whether you can tell positioning from messaging, choose the right frame of reference, and spot a positioning trap.
