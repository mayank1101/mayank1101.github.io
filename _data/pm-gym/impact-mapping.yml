practice:
  - scenario: |-
      An executive asks you to lead an initiative: grow premium subscriptions by 15% this quarter. The team immediately starts pitching feature ideas.
    question: |-
      Where should the impact map start?
    difficulty: easy
    options:
      - text: |-
          Collect the team's feature ideas first
        msg: |-
          Features are the last link of the chain, not the first. Ideas collected now will anchor everyone before the goal and actors are even defined.
      - text: |-
          Anchor the goal, then find the actors who move it
        msg: |-
          Right order: goal → actors → impacts → deliverables. Once you know free-tier listeners hold the leverage and what behavior must change, only then do feature ideas get evaluated.
        correct: true
      - text: |-
          List what competitors shipped for subscription growth
        msg: |-
          Competitor features are answers to their map, not yours. Without your own goal-to-actor chain, copying them is decoration, not strategy.
  - scenario: |-
      Uber wants to cut driver churn by 10%. Your team drafts the map and needs to fill in the Impact column for the actor 'part-time commuter drivers'.
    question: |-
      Which entry is a genuine impact?
    difficulty: easy
    options:
      - text: |-
          'Build a real-time parking heatmap in the app.'
        msg: |-
          That's software you ship — a deliverable. The impact is what changes in the driver's day because the heatmap exists.
      - text: |-
          'Drivers hunt less for parking and stay online longer.'
        msg: |-
          A real, observable change in human behavior — doing something less (circling for parking) and something more (staying online). Deliverables exist only to cause entries like this.
        correct: true
      - text: |-
          'Driver satisfaction score improves by 10 points.'
        msg: |-
          That's a metric — goal-level territory. An impact names the concrete behavior change that would move such a metric, not the metric itself.
  - scenario: |-
      Duolingo's goal is +20% daily active users. A senior stakeholder insists on building a multiplayer gaming lounge and wants your support.
    question: |-
      How do you evaluate the request with the impact map?
    difficulty: easy
    options:
      - text: |-
          Support it — the stakeholder is senior
        msg: |-
          'Engaging' is a hope, not a trace. The map demands a specific line: which actor changes which daily behavior because of the lounge? If that line can't be drawn, the feature is floating.
      - text: |-
          Place it on the map and see if the trace holds
        msg: |-
          The diplomatic power of the map: you never say 'bad idea', you show the broken trace to the goal — and offer an alternative whose trace holds. Logic beats politics.
        correct: true
      - text: |-
          Decline it flatly as off-strategy
        msg: |-
          Capacity arguments invite escalation and leave the idea undead. Tracing it on the map settles whether it deserves capacity at all — and educates the stakeholder for next time.
  - scenario: |-
      A teammate writes the goal as: "Launch the new mobile app by Q2."
    question: |-
      Why isn't this a valid impact-map goal?
    difficulty: easy
    options:
      - text: |-
          It's fine — a launch date is a clear goal
        msg: |-
          A deadline doesn't make it a goal. 'Launch the app' is a deliverable — the thing you ship — dressed up as an objective. It says nothing about what business metric should move once the app exists.
      - text: |-
          It's a deliverable disguised as a goal
        msg: |-
          Right. 'Launch an app' is a deliverable, not a goal. A goal is the business outcome you want the app to cause — e.g., 'grow mobile-active users to 100k by Q2.' Starting the map with a deliverable inverts the whole method; you lose the ability to ask whether the app is even the right way to hit the outcome. A real goal names the measurable business outcome the app should cause, not the act of shipping it.
        correct: true
      - text: |-
          The date should be Q3 to be realistic
        msg: |-
          Pushing the date to Q3 changes nothing about the core problem: it's still a build target, not a business outcome. The flaw is the type of statement, not the timeline.
  - scenario: |-
      Goal: reduce support ticket volume by 30%. A PM lists only "end customers" as the actor.
    question: |-
      What's missing in the actor thinking?
    difficulty: easy
    options:
      - text: |-
          Nothing
        msg: |-
          Only end customers is too narrow. Support ticket volume is shaped by several groups — including support agents (who could deflect or resolve faster) and even engineers (whose bugs generate tickets). Missing actors means missing whole branches of the map.
      - text: |-
          It ignores secondary actors
        msg: |-
          Right. Actors include everyone who can influence the goal, not just the obvious user. Support agents could resolve issues on first contact; engineers could fix the bugs generating tickets; the help-center content team could pre-empt questions. Each is a distinct actor with its own impacts and deliverables. Narrow actor thinking blinds you to high-leverage branches. Support agents, engineers, and content teams also influence ticket volume, each opening a different branch of the map.
        correct: true
      - text: |-
          Skip actors entirely and just build a support chatbot
        msg: |-
          Jumping to a chatbot skips straight to a deliverable before mapping the actors and impacts. You might discover the biggest lever is fixing a recurring bug, not deflecting tickets — but only if you map the actors first.
  - scenario: |-
      In the Impact column, a team writes: "Users click the new 'Invite' button."
    question: |-
      Why is this a weak impact?
    difficulty: medium
    options:
      - text: |-
          It's fine — clicks are measurable behaviour
        msg: |-
          A click is an interaction with your feature, not a meaningful change in the person's behavior or life. Impacts describe people doing something more, less, or differently — not tapping a specific button you built.
      - text: |-
          A click is an interaction, not a behaviour change
        msg: |-
          Right. 'Clicks a button' ties the impact to one specific deliverable, which defeats the purpose — impacts should be solution-agnostic behavior changes. A real impact is 'existing users regularly bring in new users,' which many deliverables (invite button, referral rewards, share links) could cause. Phrasing it as a click quietly locks you into one feature before you've compared options.
        correct: true
      - text: |-
          The button just needs a bolder colour
        msg: |-
          The button's color or wording is irrelevant to why this is a weak impact. The problem is conceptual: you've written a click on a specific feature instead of a genuine, solution-agnostic behavior change.
  - scenario: |-
      Your map has: Goal (grow retention 15%) → Actor (power users) → Impact (they invite colleagues) → Deliverable (a company-wide rebranding project).
    question: |-
      What's broken?
    difficulty: medium
    options:
      - text: |-
          Nothing
        msg: |-
          The first three links are fine, but the deliverable doesn't connect. A rebranding project won't specifically make power users invite colleagues — the trace from impact to deliverable is broken, which is exactly what the map is designed to catch.
      - text: |-
          The deliverable doesn't cause the impact
        msg: |-
          Right. The deliverable doesn't cause the impact. A rebrand is a huge, diffuse effort with no clear line to 'power users invite colleagues.' A tightly-aligned deliverable would be a one-click team-invite flow or referral incentive. When the impact→deliverable link is this loose, the feature is likely waste — the map just exposed it.
        correct: true
      - text: |-
          The goal of 15% is too high; lower it and the map works
        msg: |-
          The problem isn't that the goal is too ambitious — 15% may be fine. The break is at the last link: the deliverable has no plausible path to producing the named impact.
  - scenario: |-
      Leadership hands you a strategy where the map has ten actors, each with three impacts, each with several deliverables — 60+ features. Everything is "priority."
    question: |-
      How does impact mapping help you prioritize?
    difficulty: medium
    options:
      - text: |-
          Build all 60 — they're all on the map
        msg: |-
          Building all 60 defeats the purpose. A big map isn't a to-do list — it's a menu of options. The whole value is choosing the few branches most likely to move the goal, not committing to every twig.
      - text: |-
          Treat the map as a menu, not a to-do list
        msg: |-
          Right. The map is a menu, not a mandate. Pick the actor and impact most likely to move the goal with the least effort, and pursue only the deliverables on that branch first. You can bet on one high-leverage path, learn, and then decide whether to fund the next. Impact mapping makes the options and their trade-offs visible so you can choose deliberately.
        correct: true
      - text: |-
          Split the team evenly across all ten actors
        msg: |-
          Splitting the team evenly across all branches guarantees that nothing gets enough force to move the goal. The map's purpose is to reveal where leverage concentrates, so you can focus — not to spread effort uniformly.
  - scenario: |-
      A stakeholder is adamant: "Just trust me, the AI companion feature will be huge. We don't need to map it."
    question: |-
      What's the diplomatic impact-mapping response?
    difficulty: medium
    options:
      - text: |-
          Agree and build it — trust the stakeholder
        msg: |-
          Caving to seniority abandons the tool exactly when it's most useful. 'Trust me' features that skip the map are how roadmaps fill with unaccountable bets. You can honor the stakeholder without skipping the trace.
      - text: |-
          Invite them to place it on the map and trace it
        msg: |-
          Right. You never call it a bad idea — you invite them to place it on the map: 'Which actor's behavior does this change, and how does that move our goal?' If the trace holds, great, it's justified; if it breaks, the map — not you — makes the case. It turns a political standoff into a shared, logical question.
        correct: true
      - text: |-
          Refuse outright and tell them the idea is bad
        msg: |-
          Flatly refusing sparks a political fight and wastes the map's diplomatic power. The strength of impact mapping is that it lets you challenge an idea with logic and a shared diagram, not a personal 'no.'
  - scenario: |-
      Two deliverables both trace cleanly to the goal. One is a small notification tweak (2 days); the other is a full loyalty-program build (3 months). Both target the same impact.
    question: |-
      How should the map inform your choice?
    difficulty: medium
    options:
      - text: |-
          Build the loyalty program
        msg: |-
          Automatically picking the bigger build ignores effort. When two deliverables target the same impact, the map's job is to help you get the behavior change for the least cost — so test the cheap one before betting three months.
      - text: |-
          Test the cheap deliverable first
        msg: |-
          Right. When both deliverables map to the same impact, start with the cheapest one that could plausibly cause it. Ship the 2-day notification tweak, see if it moves the behavior, and only invest in the 3-month program if the cheap test justifies it. The map shows they're interchangeable bets on one impact, so let cost and evidence decide the order. Both target the same impact, so get the behavior change for the least cost before committing 3 months.
        correct: true
      - text: |-
          Build both simultaneously to be thorough
        msg: |-
          Doing both at once spends three months and two days to move a single impact you could have tested for two days. Since they target the same behavior change, running them in parallel is redundant effort.
  - scenario: |-
      Three months into building the deliverables on your map, data shows the target impact isn't moving the goal at all — the behavior changed, but retention didn't budge.
    question: |-
      What does this reveal about the map?
    difficulty: hard
    options:
      - text: |-
          Keep building
        msg: |-
          Pushing harder on a deliverable when the impact→goal link is broken just wastes more effort. The behavior already changed; the problem is that this particular behavior turned out not to drive the goal. More of the same won't fix a wrong assumption.
      - text: |-
          The map's assumption was wrong
        msg: |-
          Right. A map encodes assumptions, and this one just proved false: you assumed this impact would move retention, but it didn't. That's valuable learning — revisit the map, pick a different actor/impact branch that more plausibly drives the goal, and redirect. The map isn't sacred; it's a hypothesis you test and revise.
        correct: true
      - text: |-
          Impact mapping is useless; abandon the technique
        msg: |-
          Impact mapping isn't 'useless' because one branch failed — it's doing exactly its job by making the failed assumption visible and cheap to correct. Abandoning the tool discards the very thing that just caught your mistake.
  - scenario: |-
      Goal: increase marketplace transactions. A junior PM maps only buyers as actors, forgetting sellers entirely.
    question: |-
      What's the risk of this omission?
    difficulty: hard
    options:
      - text: |-
          No risk
        msg: |-
          In a marketplace, transactions need both sides. Mapping only buyers means you might pour effort into demand while supply stays too thin to fulfill it — a classic way to 'succeed' at one branch and still miss the goal.
      - text: |-
          A transaction needs both sides
        msg: |-
          Right. A transaction requires a seller too. If you only map buyers, you may drive demand the supply side can't meet — no inventory, slow response, sold-out listings. Sellers are a critical actor with their own impacts (list more, respond faster, price competitively) and deliverables. Missing an actor can leave the goal unreachable no matter how well the other branch performs. Ignoring sellers means demand may outstrip supply, so the goal can stall even if buyer behavior improves.
        correct: true
      - text: |-
          Just add more impacts under the buyer actor
        msg: |-
          Adding more buyer impacts deepens the same one-sided map. The gap isn't too few buyer branches — it's a missing actor (sellers) whose behavior is equally required for a transaction to happen.
  - scenario: |-
      Someone proposes the impact: "Make users happy."
    question: |-
      Why is this a poor impact entry?
    difficulty: hard
    options:
      - text: |-
          It's great
        msg: |-
          'Make users happy' is a nice sentiment but useless on a map — it's not a specific, observable behavior change you can design a deliverable for or measure. It could 'justify' literally any feature, which means it guides nothing.
      - text: |-
          It's vague and unobservable
        msg: |-
          Right. An impact must be a concrete, observable change in behavior — something you can see people doing more, less, or differently. 'Make users happy' is vague and unmeasurable, so it can't anchor deliverables or tell you if you succeeded. Sharpen it to a behavior: 'users return within 7 days' or 'users complete a second purchase.'
        correct: true
      - text: |-
          Happiness just can't be measured by any means
        msg: |-
          Happiness can be surveyed, but that's not what makes this a weak impact. The real problem is that it's not a specific behavior change — it's a fuzzy feeling that could justify any feature and direct none.
  - scenario: |-
      Your finished impact map is beautiful, but a stakeholder asks: "How do we know these behavior changes will actually happen if we ship the deliverables?"
    question: |-
      What's the honest answer about what a map is?
    difficulty: hard
    options:
      - text: |-
          The map guarantees the outcomes
        msg: |-
          Claiming certainty oversells the map. It doesn't guarantee outcomes — it lays out your best assumptions about what drives the goal. Treating it as proof invites overconfidence and skips the testing the map is meant to enable.
      - text: |-
          It's a set of explicit assumptions to test
        msg: |-
          Right. An impact map is a set of connected assumptions — hypotheses about which behaviors drive the goal and which deliverables drive those behaviors. Its value is making those assumptions explicit so you can test the riskiest ones cheaply and update the map as evidence comes in. It's a thinking and prioritization tool, not a promise. The map makes your hypotheses visible so you can validate the riskiest links, not a guarantee of results.
        correct: true
      - text: |-
          It's just a pretty diagram; ignore it once building starts
        msg: |-
          Dismissing the map as 'just a diagram, ignore it' throws away its real benefit: it structures your assumptions so you know what to test. The right response is to treat those links as testable hypotheses, not to disown the map.
  - scenario: |-
      A PM builds the entire map alone at their desk, then presents the finished version to engineering and design as final.
    question: |-
      What's the process flaw?
    difficulty: hard
    options:
      - text: |-
          Nothing
        msg: |-
          A map built in isolation misses the whole collaborative point. Engineers and designers spot infeasible deliverables and overlooked actors; excluding them means blind spots baked in and a team with no buy-in to a plan handed down as final.
      - text: |-
          A map should be built collaboratively
        msg: |-
          Right. Impact mapping is a collaborative workshop, not a solo artifact. Building it with engineering, design, and business stakeholders surfaces better actors and impacts, catches infeasible deliverables early, and — crucially — creates shared understanding and buy-in. A map handed down as 'final' loses the alignment that's half its value. Doing it solo loses better actor/impact ideas, feasibility checks, and the team buy-in that's half the point.
        correct: true
      - text: |-
          The map is automatically wrong because one person made it
        msg: |-
          The map isn't automatically 'wrong' because one person drafted it — a solo draft can be a fine starting point. The flaw is presenting it as final without collaboration, which forfeits shared understanding and misses the team's knowledge.

flashcards:
  - category: |-
      Mindset
    title: |-
      The Golden Rule of Impact Mapping
    desc: |-
      Never ask 'what should we build?' until you know whose behavior needs to change to reach the business goal. Features come last, not first.
    application: |-
      Watch for surprising competitors for attention. Duolingo isn't just competing with Rosetta Stone — it competes with mobile games and social feeds.
  - category: |-
      Building Blocks
    title: |-
      Goals vs. Deliverables
    desc: |-
      A goal is a business result you can measure. A deliverable is just the feature you ship. Mixing them up is the most common beginner mistake.
    application: |-
      Weak: 'Our goal is to build an onboarding flow.' Strong: 'Our goal is to increase day-7 retention by 15% by Q3.'
  - category: |-
      Actors
    title: |-
      Actors Are More Than "the User"
    desc: |-
      Actors are everyone who can move your metric: customer segments, but also support agents, delivery partners, or sales teams.
    application: |-
      Uber: if drivers (actors) can't find parking, your pickup-time metric suffers — no matter how polished the rider app is.
  - category: |-
      Impacts
    title: |-
      What Counts as an Impact?
    desc: |-
      A real, observable change in human behavior — someone doing something more, less, or differently. Not a feature, not a click.
    application: |-
      Weak: 'Users utilize our notifications.' Strong: 'Casual joggers open the app daily to log their runs.'
  - category: |-
      Prioritization
    title: |-
      The Alignment Guard
    desc: |-
      Every feature request must trace back through a behavior change to the goal. If the trace line breaks, the feature is probably waste.
    application: |-
      A polite way to challenge a pet feature: "Which behavior change does this drive, and which goal does that serve?"
  - category: |-
      Thinking Tool
    title: |-
      The Right-to-Left Check
    desc: |-
      Read your map backwards to verify it: 'By building this feature, will this person change this behavior, and will that move this goal?'
    application: |-
      Walking through the map backwards out loud is a great way to pressure-test any product plan before committing to it.

vocab:
  - term: |-
      Goal
    define: |-
      The Goal: the measurable business outcome the whole map traces back to.
    clues:
      - |-
          I'm the first link in the chain — the 'why'.
      - |-
          I'm the measurable business result you're aiming for.
      - |-
          "Grow premium subscribers 15% by Q3" is an example of me.
  - term: |-
      Actor
    define: |-
      Actors: the people whose behavior can make the goal succeed or fail.
    clues:
      - |-
          I'm the 'who' of the map.
      - |-
          I'm a person whose behavior can move the goal.
      - |-
          Not just 'the user' — I might be a support agent or a delivery driver.
  - term: |-
      Impact
    define: |-
      An Impact: the behavior change in an actor that moves the goal — never a feature or a click.
    clues:
      - |-
          I'm the 'how' — a change, not a thing.
      - |-
          I'm a shift in what a person actually does.
      - |-
          "Drivers spend less time hunting for parking" is me — a behavior change, not a feature.
  - term: |-
      Deliverable
    define: |-
      A Deliverable: the feature or tool you ship to trigger a behavior change.
    clues:
      - |-
          I'm the last link — the 'what'.
      - |-
          I'm the thing engineers actually ship.
      - |-
          "A lyric-export button" is me — built only to cause an impact.
  - term: |-
      Impact Map
    define: |-
      An Impact Map: a visual chain from goal to actor to impact to deliverable that keeps features tied to outcomes.
    clues:
      - |-
          I'm the whole picture, not one link.
      - |-
          I connect business goals to features through people and behavior.
      - |-
          My four levels are goal, actor, impact, deliverable.
