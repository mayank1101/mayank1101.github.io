practice:
  - scenario: |-
      A team's entire growth model is: buy ads → users land → some convert → buy more ads with the marketing budget, sized by a fixed quarterly plan.
    question: |-
      Is this a loop or a funnel, and why?
    difficulty: easy
    options:
      - text: |-
          A loop
        msg: |-
          Repetition alone isn't a loop. Here the budget is set externally each quarter, not generated by the users acquired; the output doesn't fund the next input.
      - text: |-
          A funnel
        msg: |-
          Right. It only becomes a paid loop if the revenue from acquired users funds the next round of ads. A fixed external budget is linear refilling — a funnel. The spend is set externally, not generated by the users it acquires, so nothing compounds on its own.
        correct: true
      - text: |-
          Neither
        msg: |-
          Advertising is central to many growth models; the question is only whether it's structured as a self-funding loop or a linear funnel.
  - scenario: |-
      A design tool grows because users share editable project links with collaborators, who sign up to edit and then share their own projects.
    question: |-
      Which loop type is this?
    difficulty: easy
    options:
      - text: |-
          Paid loop
        msg: |-
          No revenue is being reinvested to acquire users here; users are exposing other users through collaboration. That's not a paid loop.
      - text: |-
          Viral loop
        msg: |-
          Right. The reinvested output is people: collaborators become users become sharers. That direct user-brings-user structure is a viral loop. Users bring in other users directly through collaboration and sharing.
        correct: true
      - text: |-
          Content loop
        msg: |-
          The projects are shared with specific collaborators to bring them in, not published to attract strangers via search. The mechanism is direct invitation — viral, not content.
  - scenario: |-
      A blog-style product grows as users publish public posts that rank in search, drawing readers who sign up and publish their own posts.
    question: |-
      Which loop type, and what's the reinvestment?
    difficulty: easy
    options:
      - text: |-
          Viral loop
        msg: |-
          Readers aren't personally invited; they discover public posts through search. The mechanism is discoverable content, not direct invitation.
      - text: |-
          Content loop
        msg: |-
          Right. The output being reinvested is content: posts pull in readers who become publishers whose posts pull in more readers. User-generated posts attract new users via search, some of whom publish more posts.
        correct: true
      - text: |-
          Paid loop
        msg: |-
          Organic search traffic from user-generated content isn't paid acquisition. No revenue is being reinvested; content is the engine.
  - scenario: |-
      A viral loop currently has each user bringing in an average of 1.3 new users per cycle.
    question: |-
      What does a loop factor of 1.3 imply?
    difficulty: easy
    options:
      - text: |-
          The loop is shrinking and needs urgent rescue
        msg: |-
          A factor above 1 means each cycle is larger than the last — that's growth, not shrinkage. Below 1 would be the shrinking case.
      - text: |-
          The loop is compounding
        msg: |-
          Right. Above 1, every turn adds more than the previous one, driving compounding growth. The further above 1 (and the shorter the cycle), the faster. Each cycle produces more new inputs than the last, so it grows over time.
        correct: true
      - text: |-
          1.3 is meaningless without knowing the ad budget
        msg: |-
          The loop factor is a property of the loop's own mechanics, independent of any ad budget — it directly tells you whether the loop grows or decays.
  - scenario: |-
      Two viral loops have the same loop factor of 1.2, but one completes a cycle in 2 days and the other in 30 days.
    question: |-
      Which grows faster, and why?
    difficulty: easy
    options:
      - text: |-
          They grow identically
        msg: |-
          Same loop factor sets the per-cycle multiplier, but not how often it applies. Cycle time determines how many times that multiplier compounds per month.
      - text: |-
          The 2-day loop
        msg: |-
          Right. Loop factor is how much each turn multiplies; cycle time is how often. The 2-day loop turns ~15x more often, compounding dramatically faster. A shorter cycle time applies the same multiplier far more often, so it compounds much faster.
        correct: true
      - text: |-
          The 30-day loop
        msg: |-
          Stability isn't the question, speed of compounding is. At equal loop factors, the faster cycle wins decisively.
  - scenario: |-
      A PM wants to improve a content loop but every step is roughly equal except publishing, where 90% of users drop off before ever creating a post.
    question: |-
      Where's the leverage?
    difficulty: medium
    options:
      - text: |-
          Spread effort evenly across all steps
        msg: |-
          Even effort ignores that one step is choking the whole loop. The weakest step caps the loop's output regardless of how good the others are.
      - text: |-
          The publishing step, where 90% drop out
        msg: |-
          Right. A loop is limited by its worst step. Fixing the 90% publishing drop-off feeds every downstream step and the reinvestment, multiplying through the loop. The loop's weakest step caps the whole thing, so reducing that 90% drop-off unlocks the most compounding.
        correct: true
      - text: |-
          Add a second loop instead of fixing this one
        msg: |-
          Bolting on another loop while this one has a 90% choke point leaves huge value on the table; fix the bottleneck in the existing loop first.
  - scenario: |-
      A subscription business reinvests revenue into ads, but its customer acquisition cost has risen above what an average customer pays over their lifetime.
    question: |-
      What's happening to this paid loop?
    difficulty: medium
    options:
      - text: |-
          It's healthy
        msg: |-
          A paid loop only sustains while each customer earns back more than they cost. Once CAC exceeds lifetime value, every cycle loses money.
      - text: |-
          It's underwater
        msg: |-
          Right. The paid loop's survival condition (LTV > CAC) is now violated, so reinvesting revenue into ads shrinks the business rather than compounding it. With acquisition cost above lifetime value, each turn of the loop destroys value and burns the loop down.
        correct: true
      - text: |-
          It just needs to spend even more on ads to escape
        msg: |-
          Spending more when each customer is unprofitable accelerates the losses. The fix is lowering CAC or raising LTV, not more spend.
  - scenario: |-
      A founder describes their growth as a "funnel" and asks only "how do we get more visitors to the top?"
    question: |-
      How would loop thinking reframe the question?
    difficulty: medium
    options:
      - text: |-
          It wouldn't
        msg: |-
          That's pure funnel thinking, which needs ever-more external inflow to grow. Loop thinking asks a different, compounding question.
      - text: |-
          Ask "how does each user we get generate the next?"
        msg: |-
          Right. Loop thinking shifts from endlessly refilling the top to designing a self-feeding cycle, where users, content, or revenue produce the next round of growth. Looking for a way the output feeds back as new input.
        correct: true
      - text: |-
          Loop thinking says to ignore acquisition entirely
        msg: |-
          Loops don't ignore acquisition — they change where it comes from, generating it internally rather than only buying it externally.
  - scenario: |-
      A team adds a referral feature, but users have such a poor first experience that few stay long enough to refer, and those referred also churn fast.
    question: |-
      Why isn't the viral loop working?
    difficulty: medium
    options:
      - text: |-
          The referral feature must be technically broken
        msg: |-
          The mechanism can work fine; the loop still fails because the underlying experience doesn't retain users long enough to power the reinvestment step.
      - text: |-
          The loop's steps depend on retention
        msg: |-
          Right. A viral loop rests on users sticking around to invite others and those invitees sticking too. Poor retention starves the reinvestment step, so the factor collapses. Users who churn before referring, and referred users who churn, drop the loop factor below sustaining levels.
        correct: true
      - text: |-
          Viral loops never work for any product
        msg: |-
          Viral loops work for many products — but only on top of an experience good enough to retain users through the referral step. The issue is the foundation, not loops in general.
  - scenario: |-
      A product's growth has quietly reversed: usage and new signups both shrink a little more each month.
    question: |-
      How might a loop explain this?
    difficulty: medium
    options:
      - text: |-
          Loops only grow, so none can explain a decline
        msg: |-
          Loops run in both directions. When the loop factor falls below 1, the same feedback that drove growth now drives compounding decline.
      - text: |-
          A loop running in reverse, shrinking each cycle
        msg: |-
          Right. The compounding cuts both ways. A once-growing loop whose factor slips under 1 shrinks a bit more each cycle, exactly matching this pattern. With a loop factor below 1, each cycle produces fewer inputs than the last, so decline feeds decline.
        correct: true
      - text: |-
          It's a seasonal blip unrelated to any loop
        msg: |-
          A steady month-over-month shrinkage compounding over time is the signature of a loop with a sub-1 factor, not a one-off seasonal dip.
  - scenario: |-
      A PM claims their SEO strategy is automatically a "growth loop" because it brings in users from search.
    question: |-
      Is bringing users from search enough to make it a loop?
    difficulty: hard
    options:
      - text: |-
          Yes — any channel bringing users is a loop
        msg: |-
          A channel that only brings users one-way is a funnel. It's a loop only if those users feed back to produce more of the input.
      - text: |-
          No — a loop needs new users to produce more input
        msg: |-
          Right. SEO can be a plain acquisition funnel or the engine of a content loop. What makes it a loop is the closure: new users generating more discoverable content.
        correct: true
      - text: |-
          Yes, because search traffic is free
        msg: |-
          Cost has nothing to do with loop-versus-funnel. Free one-way traffic is still a funnel unless the output feeds back into the input.
  - scenario: |-
      A team wants to prioritize between two improvements: one raises the loop factor from 1.1 to 1.3, the other has no effect on the loop.
    question: |-
      Which is more strategically valuable for compounding growth?
    difficulty: hard
    options:
      - text: |-
          Whichever is easier to build, regardless of loop impact
        msg: |-
          Ease matters for sequencing, but the question is strategic value for compounding growth, where loop-factor impact dominates.
      - text: |-
          Raising the loop factor from 1.1 to 1.3
        msg: |-
          Right. Improvements to the loop itself compound indefinitely; a change with no loop effect is a one-time bump. For durable growth, strengthen the loop. A higher factor compounds through every future cycle, unlike a one-off change outside the loop.
        correct: true
      - text: |-
          The one with no loop effect
        msg: |-
          Loop factor is precisely what governs whether growth compounds; improving it is among the highest-leverage things you can do.
  - scenario: |-
      A viral loop's invite step works, but invited users land on a confusing signup page and most never activate.
    question: |-
      How does this cap the loop?
    difficulty: hard
    options:
      - text: |-
          It doesn't — the invite step still works
        msg: |-
          Invites sent aren't the same as users gained. If invited users don't activate, they never take the action that reinvests into the loop.
      - text: |-
          Fewer invitees activate, so fewer go on to invite
        msg: |-
          Right. The loop is only as strong as the flow through every step. A leaky activation step means few invitees become new inviters, dragging the loop factor down. Throttling the reinvestment and the loop factor.
        correct: true
      - text: |-
          Send even more invites to compensate for it
        msg: |-
          Sending more invites into a leaky activation step wastes them; the compounding fix is repairing the step where invited users are lost.
  - scenario: |-
      Leadership asks why a competitor with a strong content loop keeps pulling ahead despite spending less on ads.
    question: |-
      What's the likely explanation?
    difficulty: hard
    options:
      - text: |-
          The competitor must secretly be outspending them on ads
        msg: |-
          The premise is that the competitor spends less on ads; inventing hidden spend ignores the actual mechanism — a compounding content loop.
      - text: |-
          A compounding content loop grows with less ongoing spend
        msg: |-
          Right. A healthy loop compounds on its own, so the competitor gains ground without proportional ad spend, while a pure paid funnel needs constant fuel to keep pace. Each piece of content keeps attracting users who create more, unlike paid acquisition that stops when spend stops.
        correct: true
      - text: |-
          Content loops are luck and can't be explained
        msg: |-
          Content loops are a deliberate, explainable structure: discoverable user content attracting users who create more. The compounding advantage is by design, not luck.
  - scenario: |-
      A marketplace grows because more buyers attract more sellers, and more sellers (with more selection) attract more buyers.
    question: |-
      How should you describe this structure?
    difficulty: hard
    options:
      - text: |-
          A simple funnel
        msg: |-
          This isn't one-way. Each side's growth feeds the other's, which loops back to feed the first — the opposite of a linear funnel.
      - text: |-
          A two-sided loop
        msg: |-
          Right. Buyers attract sellers attract buyers is a closed, self-reinforcing loop across two sides — the classic marketplace flywheel, compounding as it turns. Each side's growth feeds the other, and that mutual reinforcement compounds like a growth loop.
        correct: true
      - text: |-
          Two unrelated funnels that happen to share a brand
        msg: |-
          They're not unrelated — the whole point is that each side directly drives the other. That coupling is exactly what makes it a loop rather than two separate funnels.

flashcards:
  - category: |-
      Foundation
    title: |-
      Growth Loop
    desc: |-
      A circular growth system where the output of one cycle (new users, content, or revenue) is reinvested as the input to the next, so growth compounds.
    application: |-
      Ask "how does each user or dollar generate the next?" instead of only "how do we get more into the top?"
  - category: |-
      Contrast
    title: |-
      Funnel vs. Loop
    desc: |-
      A funnel is linear and needs constant refilling at the top; a loop feeds its output back as new input and compounds.
    application: |-
      When growth depends on ever-more spending to stay flat, you have a funnel; look for a loop you can build instead.
  - category: |-
      Type
    title: |-
      Viral Loop
    desc: |-
      A loop where users bring in other users directly — via invites, referrals, or collaboration that exposes non-users to the product.
    application: |-
      Reduce friction in the invite or sharing step; it's the reinvestment point that drives the whole viral loop.
  - category: |-
      Type
    title: |-
      Content Loop
    desc: |-
      A loop where users or the product generate content that attracts new users (often via search or sharing), some of whom create more content.
    application: |-
      Make user-generated content public and discoverable so each piece can pull in the next cohort of users.
  - category: |-
      Metric
    title: |-
      Loop Factor
    desc: |-
      How many new inputs each turn of the loop produces. Above 1, the loop grows; below 1, it decays.
    application: |-
      Track the loop factor: a viral loop bringing 0.8 users per user is shrinking, not growing, however busy it looks.
  - category: |-
      Metric
    title: |-
      Cycle Time
    desc: |-
      How long one full turn of a loop takes. Shorter cycle times compound growth faster, even at the same loop factor.
    application: |-
      Speeding up the loop (shorter cycle time) can matter as much as increasing how many users each cycle brings.

vocab:
  - term: |-
      Growth Loop
    define: |-
      Growth Loop: a circular system where each cycle's output is reinvested as the next cycle's input, so growth compounds.
    clues:
      - |-
          I'm circular, not a straight line.
      - |-
          My output becomes my next input.
      - |-
          I compound where a funnel just leaks.
  - term: |-
      Viral Loop
    define: |-
      Viral Loop: a growth loop where users directly bring in other users through invites, referrals, or collaboration.
    clues:
      - |-
          I'm a loop where users bring users.
      - |-
          Invites, referrals, and collaboration are how I turn.
      - |-
          My reinvestment point is the sharing step.
  - term: |-
      Content Loop
    define: |-
      Content Loop: a growth loop where content (from users or the product) attracts new users, some of whom generate more content.
    clues:
      - |-
          I'm a loop that runs on things users or the product make.
      - |-
          Search and sharing carry my output to new users.
      - |-
          Some of those new users make more of what feeds me.
  - term: |-
      Paid Loop
    define: |-
      Paid Loop: a growth loop where revenue from users funds acquisition of more users — sustainable only while lifetime value exceeds acquisition cost.
    clues:
      - |-
          I run on reinvested money, not people or posts.
      - |-
          Revenue funds ads that fund more revenue.
      - |-
          I only hold while a customer earns back more than they cost.
  - term: |-
      Loop Factor
    define: |-
      Loop Factor: the number of new inputs each turn of a loop produces — above 1 the loop grows, below 1 it decays.
    clues:
      - |-
          I count new inputs produced per cycle.
      - |-
          Above 1 you grow; below 1 you shrink.
      - |-
          A viral loop at 0.8 of me is quietly dying.
  - term: |-
      Cycle Time
    define: |-
      Cycle Time: how long one full turn of a growth loop takes — shorter cycle times compound growth faster.
    clues:
      - |-
          I'm about speed, not size.
      - |-
          I measure how long one turn of the loop takes.
      - |-
          Shorten me and the same loop compounds faster.
