# PM Gym — business-product-outcomes. Generated from the original page markup;
# edit here to add or reword questions, cards and clues.
practice_badge: |-
  Apply what you learned
practice_heading: |-
  Practice Scenarios
practice_blurb: |-
  15 situations that test whether you can separate output from outcome, pick the right target, and read the signals. Choose the strongest move, then read why the rest fall short.
